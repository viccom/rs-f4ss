name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Daily at 03:30 UTC — catches dependency drift (e.g. a git-pinned
    # crate publishing breaking changes) within a day even when master
    # is quiet (R1/R8).
    - cron: "30 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Formatting & lint — fastest checks first, fail fast
  # ─────────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────────────────────────────
  # Unit / integration tests across the feature matrix
  # ─────────────────────────────────────────────────────────────────────
  test-linux:
    name: test (linux · ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "webdav"                                # default
          - "webdav,http"
          - "webdav,api"
          - "webdav,http,api,serve"                 # everything except s3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - name: Run tests
        run: |
          if [ "${{ matrix.features }}" = "webdav" ]; then
            cargo test --all-features
          else
            cargo test --no-default-features --features "${{ matrix.features }}"
          fi
        env:
          RUST_LOG: rs_f4ss=warn

  test-windows:
    name: test (windows · webdav)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        # The chocolatey `winfsp` package is currently marked "Possibly broken"
        # (v2.1.25156 packages the MSI in an OPC wrapper chocolatey can't
        # extract properly). Install the official MSI from GitHub Releases
        # directly. The MSI's full layout puts DLLs at
        # C:\Program Files\WinFsp\DYNAMIC\SxS\DYNAMIC\bin\winfsp-x64.dll —
        # the WinFsp Launcher service is what later deploys them to bin\.
        # We don't run the launcher on CI, so we just copy from the SxS path.
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $msi = "$env:TEMP\winfsp.msi"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          Write-Host "Running silent install…"
          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", $msi, "/qn", "/norestart" -Wait -PassThru
          Write-Host "msiexec exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
      - name: Add WinFsp to PATH
        # WinFsp 2.0 MSI installs into "Program Files (x86)"; keep the other
        # candidate as fallback so PATH is right either way.
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WinFsp\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\WinFsp\bin"
      - name: Stage WinFsp DLL next to test binaries
        # LoadLibraryW("winfsp-x64.dll") searches the exe directory first;
        # cargo's per-test binary lives in target\debug\deps\ so put a copy
        # there. The MSI installs the DLL at the SxS path below; copy it
        # from there rather than relying on the launcher service to deploy.
        run: |
          $candidates = @(
            "C:\Program Files\WinFsp\bin\winfsp-x64.dll",
            "C:\Program Files\WinFsp\DYNAMIC\SxS\DYNAMIC\bin\winfsp-x64.dll",
            "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll"
          )
          $src = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $src = $p; break }
          }
          if (-not $src) {
            $src = (Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "winfsp-x64.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $src) {
            Write-Host "winfsp-x64.dll not found. Dumping C:\Program Files:"
            Get-ChildItem -Path "C:\Program Files" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "WinFsp|winfsp" } | Select-Object FullName | Format-Table -HideTableHeaders
            exit 1
          }
          Write-Host "Staging $src → deps\winfsp-x64.dll"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\target\debug\deps" | Out-Null
          Copy-Item $src -Destination "${{ github.workspace }}\target\debug\deps\winfsp-x64.dll" -Force
      - name: Run tests
        run: cargo test --all-features
        env:
          RUST_LOG: rs_f4ss=warn


  # ─────────────────────────────────────────────────────────────────────
  # Windows E2E — dufs (WebDAV) → rs-f4ss (WinFsp) → PowerShell (R8)
  # ─────────────────────────────────────────────────────────────────────
  windows-e2e:
    name: e2e (windows · winfsp)
    runs-on: windows-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        # Same MSI approach as the test-windows job (choco package is broken)
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $msi = "$env:TEMP\winfsp.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", $msi, "/qn", "/norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
      - name: Add WinFsp to PATH
        # WinFsp 2.0 MSI installs into "Program Files (x86)"; keep the other
        # candidate as fallback so PATH is right either way.
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WinFsp\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\WinFsp\bin"
      - name: Install dufs (test WebDAV server)
        run: |
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/sigoden/dufs/releases/download/v0.43.0/dufs-v0.43.0-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\dufs.zip" -UseBasicParsing
              Expand-Archive -Path "$env:TEMP\dufs.zip" -DestinationPath "$env:TEMP\dufs" -Force
              Copy-Item "$env:TEMP\dufs\dufs.exe" -Destination "C:\Windows\dufs.exe" -ErrorAction SilentlyContinue
              if (-not (Test-Path "C:\Windows\dufs.exe")) {
                $dufs = Get-ChildItem "$env:TEMP\dufs" -Filter "dufs.exe" -Recurse | Select-Object -First 1
                Copy-Item $dufs.FullName -Destination "C:\Windows\dufs.exe"
              }
              break
            } catch {
              Write-Host "dufs download attempt $i failed, retrying in 5s…"
              Start-Sleep -Seconds 5
            }
          }
          dufs --version
      - name: Build release binary
        run: cargo build --release --all-features
        env:
          RUST_LOG: rs_f4ss=warn
      - name: Stage WinFsp DLL next to binary
        # rs-f4ss loads winfsp-x64.dll via standard DLL search (exe dir first);
        # staging a copy removes any dependence on the MSI install location.
        run: |
          $dll = @(
            "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll",
            "C:\Program Files\WinFsp\bin\winfsp-x64.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll -Destination ".\target\release\"
            Write-Host "staged: $dll -> target\release\"
          } else {
            Write-Host "::warning::winfsp-x64.dll not found in known install dirs"
          }
      - name: Run E2E (WinFsp mount)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File tests/e2e.ps1 -DufsMountExe "./target/release/rs-f4ss.exe"
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-logs
          path: |
            $env:TEMP\rs-f4ss-*.log
            $env:TEMP\dufs-*.log
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Release build — every feature combination that ships
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.target || 'linux' }} · ${{ matrix.features || 'all' }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
            target: ""
            cmd: "build"
          - os: ubuntu-latest
            features: "webdav,http,api,serve"
            target: ""
            cmd: "build"
          - os: windows-latest
            features: ""
            target: "x86_64-pc-windows-msvc"
            cmd: "build"
          - os: windows-latest
            features: "webdav,http,api,serve"
            target: "x86_64-pc-windows-msvc"
            cmd: "build"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE + Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - name: Install WinFsp (Windows)
        if: runner.os == 'Windows'
        run: choco install winfsp --no-progress
      - name: Add WinFsp to PATH (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\WinFsp\bin"
      - name: cargo build
        shell: bash
        run: |
          ARGS=(--release)
          if [ -n "${{ matrix.target }}" ]; then
            ARGS+=(--target "${{ matrix.target }}")
          fi
          if [ "${{ matrix.features }}" = "" ]; then
            cargo build "${ARGS[@]}"
          else
            cargo build --no-default-features --features "${{ matrix.features }}" "${ARGS[@]}"
          fi

  # ─────────────────────────────────────────────────────────────────────
  # E2E — runs the shell scripts against a real dufs server + FUSE
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: e2e (linux)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dufs (test server)
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL "https://github.com/sigoden/dufs/releases/download/v0.43.0/dufs-v0.43.0-x86_64-unknown-linux-musl.tar.gz" \
              | sudo tar -xz -C /usr/local/bin dufs && break
            echo "dufs download attempt $i failed, retrying in 5s…"
            sleep 5
          done
          dufs --version
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - name: Build release binary
        run: cargo build --release --all-features
      - name: Run E2E (FUSE mount)
        run: bash tests/e2e.sh
      - name: Run E2E (REST API)
        run: bash tests/e2e-api.sh
      - name: Run E2E (P2P share)
        run: bash tests/e2e-share.sh
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/rs-f4ss-*.log
            /tmp/dufs-*.log
          if-no-files-found: ignore
          retention-days: 7
